name: CI

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  push:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # action v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Build
        run: just build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # action v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Install Solhint
        run: npm ci --prefix dev
      - name: Lint
        run: just lint

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # action v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Install Slither
        run: |
          python -m venv dev/.venv
          dev/.venv/bin/pip install -r dev/requirements.txt
      - name: Slither
        run: just slither

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # action v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Test
        run: just test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # action v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Coverage
        run: just coverage-check
