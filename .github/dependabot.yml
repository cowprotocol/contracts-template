version: 2
updates:
  - package-ecosystem: npm
    directory: /dev
    schedule:
      interval: weekly
    groups:
      npm-dev-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /dev
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
