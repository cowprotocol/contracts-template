[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read-write", path = "./" },
]

# Compiler
auto_detect_solc = false
solc = "0.8.34" # See latest release at: https://github.com/argotorg/solidity/releases
via_ir = true
optimizer = true
optimizer_runs = 100_000
evm_version = "cancun"

# Keep deployment bytecode stable. This helps deterministic deployments because
# metadata changes (like compiler version) will not change the final bytecode hash.
# See: https://docs.soliditylang.org/en/latest/metadata.html#encoding-of-the-metadata-hash-in-the-bytecode
bytecode_hash = "none"
cbor_metadata = false

# Fuzz
fuzz = { runs = 1_000 }
invariant = { runs = 100, depth = 20, fail_on_revert = true }

[profile.ci]
  fuzz = { runs = 10_000 }
  invariant = { runs = 100, depth = 100, fail_on_revert = true }
  verbosity = 3 # outputs stack trace for failed tests only (https://book.getfoundry.sh/reference/config/testing)

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 125
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
sort_imports = true

[lint]
exclude_lints = ["asm-keccak256","unwrapped-modifier-logic","pascal-case-struct","mixed-case-function","unsafe-typecast","unsafe-cheatcode","unchecked-call","block-timestamp"]

[rpc_endpoints]
mainnet = "{ETH_RPC_URL}"

# Note: as of Etherscan API v2, the API key is shared across all chains
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
